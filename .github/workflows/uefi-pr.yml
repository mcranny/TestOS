name: UEFI PR checks

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  uefi-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ovmf_code: ${{ steps.ovmf.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            make \
            python3 \
            python3-pip \
            qemu-system-x86 \
            ovmf \
            mtools \
            gdisk \
            wget \
            ca-certificates \
            xz-utils

      - name: Install Python image tooling
        run: python3 -m pip install --user pyfatfs

      - name: Fetch pinned Limine UEFI loader
        env:
          LIMINE_VERSION: "12.6.0"
          LIMINE_SHA256: "44fb480294463c15823bba5378c955b46d15d08fc7b5a74de49fef2953d1878d"
        run: |
          mkdir -p build/limine-bin
          wget -q -O /tmp/limine.tar.xz \
            "https://github.com/limine-bootloader/limine/releases/download/v${LIMINE_VERSION}/limine-binary.tar.xz"
          echo "${LIMINE_SHA256}  /tmp/limine.tar.xz" | sha256sum -c -
          tar -xJf /tmp/limine.tar.xz -C /tmp
          # Binary tarball layout varies slightly by release; locate BOOTX64.EFI.
          efi="$(find /tmp -type f -name BOOTX64.EFI | head -n 1)"
          test -n "${efi}"
          cp "${efi}" build/limine-bin/BOOTX64.EFI

      - name: Resolve OVMF firmware path
        id: ovmf
        run: |
          for path in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd \
            /usr/share/edk2-ovmf/x64/OVMF_CODE.fd
          do
            if [ -f "${path}" ]; then
              echo "code=${path}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "OVMF code firmware not found" >&2
          exit 1

      - name: Verify version.h is well-formed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("uefi/version.h").read_text(encoding="utf-8")
          if "\n" not in text:
              raise SystemExit("uefi/version.h has no newlines (corrupted header)")
          if 'TESTOS_VERSION "0.13"' not in text:
              raise SystemExit("uefi/version.h must define TESTOS_VERSION \"0.13\"")
          print("version.h OK")
          PY

      - name: Build UEFI kernel and local USB image
        run: |
          make uefi-kernel
          python3 dev/make-local-usb-image.py

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-boot-image
          path: |
            build/testos-uefi.elf
            build/testos-usb-local.img
            build/limine-bin/BOOTX64.EFI

  uefi-shell-smoke:
    needs: uefi-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [ata, ahci, nvme]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            qemu-system-x86 \
            ovmf

      - name: Download boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot-image
          path: build

      - name: Resolve OVMF firmware path
        id: ovmf
        run: |
          for path in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd \
            /usr/share/edk2-ovmf/x64/OVMF_CODE.fd
          do
            if [ -f "${path}" ]; then
              echo "code=${path}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "OVMF code firmware not found" >&2
          exit 1

      - name: Run UEFI shell reliability smoke (${{ matrix.backend }})
        env:
          TESTOS_OVMF_CODE: ${{ steps.ovmf.outputs.code }}
          TESTOS_SERIAL_PORT: "5555"
        run: python3 dev/uefi-shell-smoke.py ${{ matrix.backend }}

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-shell-smoke-${{ matrix.backend }}
          path: |
            build/uefi-shell-test.log
            build/*.log
          if-no-files-found: ignore

  uefi-http-smoke:
    needs: uefi-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            qemu-system-x86 \
            ovmf

      - name: Download boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot-image
          path: build

      - name: Resolve OVMF firmware path
        id: ovmf
        run: |
          for path in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd \
            /usr/share/edk2-ovmf/x64/OVMF_CODE.fd
          do
            if [ -f "${path}" ]; then
              echo "code=${path}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "OVMF code firmware not found" >&2
          exit 1

      - name: Run UEFI HTTP interop smoke
        env:
          TESTOS_OVMF_CODE: ${{ steps.ovmf.outputs.code }}
          TESTOS_SERIAL_PORT: "5556"
        run: python3 dev/uefi-http-smoke.py

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-http-smoke-logs
          path: |
            build/*.log
          if-no-files-found: ignore

  uefi-net-smoke:
    needs: uefi-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            qemu-system-x86 \
            ovmf

      - name: Download boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: uefi-boot-image
          path: build

      - name: Resolve OVMF firmware path
        id: ovmf
        run: |
          for path in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd \
            /usr/share/edk2-ovmf/x64/OVMF_CODE.fd
          do
            if [ -f "${path}" ]; then
              echo "code=${path}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "OVMF code firmware not found" >&2
          exit 1

      - name: Run UEFI network smoke
        env:
          TESTOS_OVMF_CODE: ${{ steps.ovmf.outputs.code }}
          TESTOS_SERIAL_PORT: "5557"
        run: python3 dev/uefi-net-smoke.py

      - name: Upload net smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-net-smoke-logs
          path: |
            build/uefi-net-smoke.log
            build/*.log
          if-no-files-found: ignore
